<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedBox — System settings, device configuration, and notification preferences.">
  <title>MedBox — Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <h1>💊 MedBox</h1>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="medications.html">Medications</a>
        <a href="history.html">History</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </header>

    <main>
      <h2 class="section-header">⚙️ Settings</h2>

      <div class="grid grid-2">
        <!-- Device Settings -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">📡 Device</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="device-name">Device Name</label>
            <input class="form-input" type="text" id="device-name" value="MedBox-01">
          </div>
          <div class="form-group">
            <label class="form-label" for="timezone">Timezone</label>
            <select class="form-select" id="timezone">
              <option value="28800" selected>Asia/Manila (UTC+8)</option>
              <option value="0">UTC</option>
            </select>
          </div>
          <button class="btn btn-primary" id="btn-save-device">💾 Save Device Settings</button>
        </section>

        <!-- Notification Settings -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">🔔 Notifications</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="ntfy-topic">ntfy Topic or URL</label>
            <input class="form-input" type="text" id="ntfy-topic" placeholder="e.g. med-box-notification or https://ntfy.sh/med-box-notification" value="med-box-notification">
          </div>
          <div class="form-group">
            <label class="form-label" for="reminder-interval">Reminder Interval (minutes)</label>
            <input class="form-input" type="number" id="reminder-interval" value="5" min="1" max="60">
          </div>
          <div class="form-group">
            <label class="form-label" for="max-reminders">Max Reminders</label>
            <input class="form-input" type="number" id="max-reminders" value="12" min="1" max="50">
          </div>
          <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;">
            <button class="btn btn-primary" id="btn-save-notify">💾 Save Notification Settings</button>
            <button class="btn btn-secondary" id="btn-test-notify">🔔 Send Test Alert</button>
          </div>
        </section>

        <!-- Module Status -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">📦 Modules</span>
          </div>
          <div id="module-status-list">
            <!-- Populated by JS if devices API is available -->
            <div style="display: flex; justify-content: space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border);">
              <span>Module 1 (Main)</span>
              <span class="badge badge-success">Active</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border);">
              <span>Module 2</span>
              <span class="badge badge-info">Connected</span>
            </div>
            <div style="display: flex; justify-content: space-between; padding: var(--space-3) 0;">
              <span>Module 3</span>
              <span class="badge badge-error">Not Connected</span>
            </div>
          </div>
        </section>

        <!-- Danger Zone -->
        <section class="card">
          <div class="card-header">
            <span class="card-title" style="color: var(--color-error);">⚠️ Danger Zone</span>
          </div>
          <div class="form-group">
            <button class="btn btn-danger" id="btn-clear-history">🗑️ Clear All History</button>
          </div>
          <div class="form-group">
            <button class="btn btn-danger" id="btn-factory-reset">🔄 Factory Reset Device</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
