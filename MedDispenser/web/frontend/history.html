<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedBox — Medication dispensing history and event log.">
  <title>MedBox — History</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <h1>💊 MedBox</h1>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="medications.html">Medications</a>
        <a href="history.html" class="active">History</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main>
      <h2 class="section-header">📋 Medication History</h2>

      <section class="card">
        <table class="table" id="history-table">
          <thead>
            <tr>
              <th>Date / Time</th>
              <th>Medicine</th>
              <th>Dose</th>
              <th>Module</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <!-- Populated by JS -->
          </tbody>
        </table>
        <div class="empty-state" id="history-empty" style="display: none;">
          <div class="empty-state-icon">📋</div>
          <div class="empty-state-text">No dispense history yet</div>
          <div class="empty-state-sub">Events will appear here as your MedBox dispenses medications.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
