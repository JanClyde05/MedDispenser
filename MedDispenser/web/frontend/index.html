<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedBox — Smart Medication Dispenser Dashboard. View today's medication schedule and system status.">
  <title>MedBox — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <h1>💊 MedBox</h1>
      <nav class="nav" id="main-nav">
        <a href="index.html" class="active">Dashboard</a>
        <a href="medications.html">Medications</a>
        <a href="history.html">History</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main>
      <!-- System Status -->
      <section class="card" style="margin-bottom: var(--space-6);">
        <div class="card-header">
          <span class="card-title">System Status</span>
          <span class="badge badge-success" id="status-badge">Online</span>
        </div>
        <div class="grid grid-3">
          <div>
            <div class="form-label">Device</div>
            <div id="device-status" style="font-weight: 600;">Connecting...</div>
          </div>
          <div>
            <div class="form-label">Last Sync</div>
            <div id="last-sync">—</div>
          </div>
          <div>
            <div class="form-label">Active Modules</div>
            <div id="active-modules">—</div>
          </div>
        </div>
      </section>

      <!-- Today's Schedule -->
      <section>
        <h2 style="font-size: var(--font-size-2xl); font-weight: 700; margin-bottom: var(--space-6);">
          Today's Medications
        </h2>
        <div class="grid grid-2" id="schedule-list">
          <!-- Populated by JS -->
          <div class="schedule-card">
            <div class="schedule-time">07:00</div>
            <div class="schedule-info">
              <div class="schedule-medicine">Metformin</div>
              <div class="schedule-dose">1 tablet · Module 1</div>
            </div>
            <span class="badge badge-warning">Pending</span>
          </div>
          <div class="schedule-card">
            <div class="schedule-time">12:00</div>
            <div class="schedule-info">
              <div class="schedule-medicine">Amlodipine</div>
              <div class="schedule-dose">1 tablet · Module 2</div>
            </div>
            <span class="badge badge-success">Completed</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
