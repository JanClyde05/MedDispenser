<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MedBox — Manage medications, modules, dosages, and schedules.">
  <title>MedBox — Medications</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <h1>💊 MedBox</h1>
      <nav class="nav">
        <a href="index.html">Dashboard</a>
        <a href="medications.html" class="active">Medications</a>
        <a href="history.html">History</a>
        <a href="settings.html">Settings</a>
        <a href="diagrams.html">Diagrams</a>
      </nav>
    </header>

    <main>
      <!-- Add Medication Form -->
      <section class="card" style="margin-bottom: var(--space-8);">
        <div class="card-header">
          <span class="card-title">➕ Add Medication</span>
        </div>
        <form id="medication-form">
          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label" for="med-name">Medicine Name</label>
              <input class="form-input" type="text" id="med-name" placeholder="e.g. Metformin" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="med-module">Module</label>
              <select class="form-select" id="med-module">
                <option value="1">Module 1 (Main)</option>
                <option value="2">Module 2</option>
                <option value="3">Module 3</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="med-dose">Dose (tablets per intake)</label>
              <input class="form-input" type="number" id="med-dose" min="1" max="10" value="1">
            </div>
            <div class="form-group">
              <label class="form-label" for="med-time">Time</label>
              <input class="form-input" type="time" id="med-time" value="07:00" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Days</label>
            <div class="day-selector" id="day-selector">
              <button type="button" class="day-btn" data-day="0">Sun</button>
              <button type="button" class="day-btn selected" data-day="1">Mon</button>
              <button type="button" class="day-btn selected" data-day="2">Tue</button>
              <button type="button" class="day-btn selected" data-day="3">Wed</button>
              <button type="button" class="day-btn selected" data-day="4">Thu</button>
              <button type="button" class="day-btn selected" data-day="5">Fri</button>
              <button type="button" class="day-btn" data-day="6">Sat</button>
            </div>
          </div>

          <div class="grid grid-2">
            <div class="form-group">
              <label class="form-label" for="med-start">Start Date</label>
              <input class="form-input" type="date" id="med-start">
            </div>
            <div class="form-group">
              <label class="form-label" for="med-end">End Date (optional)</label>
              <input class="form-input" type="date" id="med-end">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="btn-save-med">💾 Save Medication</button>
        </form>
      </section>

      <!-- Medication List -->
      <section>
        <h2 class="section-header">Configured Medications</h2>
        <div class="grid grid-2" id="medication-list">
          <!-- Populated by JS -->
        </div>
        <div class="empty-state" id="med-empty" style="display: none;">
          <div class="empty-state-icon">💊</div>
          <div class="empty-state-text">No medications configured yet</div>
          <div class="empty-state-sub">Use the form above to add your first medication.</div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/medications.js"></script>
</body>
</html>
